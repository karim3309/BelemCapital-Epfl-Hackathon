<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StackTrace — Rayon X</title>
  <meta name="description" content="Radiographie d'une position DeFi : graphe de dépendances prouvé, propagation de chocs et décision STAY / PARTIAL / EXIT.">
  <link rel="stylesheet" href="css/xray.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305080f'/%3E%3Cpath d='M16 5v22M10 9h12M8 14h16M10 19h12M12 24h8' stroke='%2367e8f9' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <div id="film-noise" aria-hidden="true"></div>
  <div class="calib-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✚</span>
      <span class="brand-name" data-decrypt>STACKTRACE</span>
      <span class="brand-sub">radiographie de position DeFi</span>
    </div>
    <div class="patient" id="patient">chargement…</div>
    <nav class="modes" aria-label="Modes">
      <button class="mode-btn active" data-mode="explore" title="Explorer le squelette et les preuves">Squelette</button>
      <button class="mode-btn" data-mode="scenario" title="Faire varier le prix de l'USDe et la durée du choc">Scénario</button>
      <button class="mode-btn" data-mode="impact" title="Cliquer un nœud : qui est touché s'il casse ?">Impact</button>
      <button class="mode-btn tour-btn" id="tour-btn" title="Parcours guidé en 7 étapes">Explique-moi</button>
    </nav>
  </header>

  <section class="vitals" id="vitals" aria-label="Constantes vitales de la position"></section>

  <main class="layout">
    <section class="film" aria-label="Squelette de la position">
      <div class="film-corner tl">R</div><div class="film-corner tr" id="film-block">#</div>
      <div class="film-corner bl">ETH MAINNET</div><div class="film-corner br">PT-sUSDe / USDC</div>
      <div class="scanline" id="scanline" aria-hidden="true"></div>
      <div class="svg-wrap" id="svg-wrap">
        <svg id="skeleton" role="img" aria-label="Graphe de dépendances en couches"></svg>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <section class="dock" id="dock" aria-label="Scénarios"></section>

  <div class="tour" id="tour" role="dialog" aria-modal="false" hidden></div>
  <div class="error" id="error" hidden></div>

  <footer class="foot">
    Données : <code>output/graph.json</code> (découverte prouvée), <code>output/risk_report.json</code> et
    <code>output/risk_grid.json</code> (moteur de risque Python). Aucun calcul de risque dans cette page, aucun appel réseau.
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
