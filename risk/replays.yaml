# =====================================================================
#  REPLAYS of REAL incidents (demo, the brief's "real data" criterion)
# =====================================================================
# The ON-CHAIN price path comes from the Chainlink history read at the pinned block (risk_inputs.json).
# The OFF-CHAIN price (an exchange's order book) does not exist on-chain: it is CURATED, with URL + date.
# =====================================================================
replays:
  - id: R-OCT2025
    title: "10 October 2025: USDe at $0.65 on Binance"
    story: >
      Crash of 10 October 2025: on the Binance spot order book, USDe briefly falls to $0.65 and recovers
      within about forty minutes, while on decentralised venues it stays close to $1 (source below).
      Counterfactual: if TODAY's position A (its size, health factor and oracle) had faced this price path,
      what would have happened? (Position A's PT may not even have existed on that date.)
    window: {start: "2025-10-10T00:00:00+00:00", end: "2025-10-12T00:00:00+00:00"}
    offchain_path:
      venue: Binance (spot order book)
      low: 0.65
      duration_minutes: 40
      evidence_url: "https://www.21shares.com/it-eu/insights/why-did-ethenas-stablecoin-remain-stable-onchain-but-depegged-on-binance"
      as_of: "2026-10-10"
      says: "USDe \"briefly plunging to $0.65\" on Binance spot, recovered \"within about 40 minutes\"; closer to $1 on decentralised venues (Curve)."

  - id: R-FEB2025
    title: "21 February 2025: the worst deviation ever seen by the Chainlink USDe/USD feed"
    story: >
      The day the Chainlink USDe/USD feed recorded its all-time low ($0.977), for
      a few minutes. Replayed on position A: would the oracle have switched? would we have been liquidated?
    window: {start: "2025-02-21T00:00:00+00:00", end: "2025-02-22T00:00:00+00:00"}
