# =====================================================================
#  StackTrace v2 — RISK ENGINE PARAMETERS (pockets of a real holder, live)
# =====================================================================
# Same discipline as risk/params.yaml: every parameter MUST have a status
#   source: https://...  + as_of: YYYY-MM-DD     → value read in official docs
#   hypothesis: true     + why: "<1 sentence>"    → modelling choice of OUR team, stated and displayed
# `range` = values tested in sensitivity. The loader (src/stacktrace/params.py) refuses everything else.
#
# Incident probabilities are ORDERS OF MAGNITUDE (we have no paid incident database).
# That is why the decision also shows p*: the probability threshold above which exiting
# pays off, which does NOT depend on those probabilities — only on the measured loss and exit cost.
# =====================================================================
version: 2

horizon_days:
  value: 7
  hypothesis: true
  why: "Decision horizon of a risk on-call shift (framing note: 24 h or 7 days, an open question for the mentors)."
  range: [1, 30]

monte_carlo:
  samples: {value: 100000, hypothesis: true, why: "Enough draws to stabilise the expected loss; fixed seed → reproducible."}
  seed: {value: 20261010, hypothesis: true, why: "Fixed seed: two runs at the same block give the same report."}

# ---------------------------------------------------------------- Morpho: liquidation (official formula)
morpho_lif_beta:
  value: 0.3
  source: "https://docs.morpho.org/learn/concepts/liquidation/"
  as_of: "2026-10-10"
morpho_lif_max:
  value: 1.15
  source: "https://docs.morpho.org/learn/concepts/liquidation/"
  as_of: "2026-10-10"
liquidation_repaid_fraction:
  value: 1.0
  hypothesis: true
  why: "A Morpho liquidator can repay 100% of the debt at once: worst case for the borrower."
  range: [0.5, 1.0]

# Slippage suffered when the seized collateral is resold (liquidation) — by collateral class.
liquidation_slippage:
  volatile:          {value: 0.02, hypothesis: true, why: "Major assets (BTC/ETH and liquid derivatives): deep markets.", range: [0.005, 0.05]}
  pendle_pt:         {value: 0.03, hypothesis: true, why: "PT resold on a Pendle pool of limited size.", range: [0.01, 0.10]}
  rwa_or_synthetic:  {value: 0.10, hypothesis: true, why: "RWA / synthetic dollars: thin secondary liquidity, redemption often deferred at the issuer.", range: [0.03, 0.30]}

# ---------------------------------------------------------------- exit
exit_gas_units:
  vault:  {value: 400000, hypothesis: true, why: "Withdrawal from a V2 vault (+ forceDeallocate on a few markets): a few hundred thousand gas.", range: [200000, 1500000]}
  borrow: {value: 1500000, hypothesis: true, why: "Unwind: flash loan + repayment + withdrawal + swap; order of magnitude, not measured.", range: [500000, 3000000]}
exit_swap_slippage_fallback:
  value: 0.05
  hypothesis: true
  why: "If the DEX aggregator finds no route to resell the collateral: assumed slippage, flagged as not measured."
  range: [0.01, 0.30]
exit_max_acceptable_slippage:
  value: 0.25
  hypothesis: true
  why: "Beyond 25% measured slippage, selling the collateral destroys more value than most of the risks avoided: the matching share is considered NOT exitable through the market."
  range: [0.05, 0.5]
borrow_net_carry_annual:
  value: 0.05
  hypothesis: true
  why: "Target net yield of a leveraged position (collateral yield − borrowing cost): forgone when exiting. The collateral yield cannot be read on-chain generically."
  range: [0.0, 0.15]
borrow_market_beta_excluded:
  value: true
  hypothesis: true
  why: "Belem runs market-neutral strategies: a drop of a volatile asset (ETH, BTC) is a chosen market exposure, hedged elsewhere or not, NOT a dependency risk. For a \"borrow\" pocket, a volatile-asset drop only counts through the LIQUIDATION it triggers (penalty). A default / depeg of an RWA counts in full."
exit_quote_api:
  value: "https://aggregator-api.kyberswap.com/ethereum/api/v1/routes"
  source: "https://docs.kyberswap.com/kyberswap-solutions/kyberswap-aggregator/aggregator-api-specification/evm-swaps"
  as_of: "2026-10-10"

# ---------------------------------------------------------------- incidents (annual rate λ, severity, speed)
# speed: gradual = liquidations have time to happen if the oracle follows the market
#        jump    = instant shock (exploit, sudden NAV mark-down): no time to liquidate
events:
  stable_depeg:
    applies_to: "lent asset of the vault / of the borrow (fiat stablecoin)"
    annual_rate: {value: 0.02, hypothesis: true, why: "Significant depeg of a major fiat stablecoin: rare (precedent USDC, March 2023).", range: [0.005, 0.05]}
    severity: {value: [0.02, 0.12], hypothesis: true, why: "Size of a fiat stablecoin depeg (precedent: ~12% in March 2023)."}
    speed: gradual
  volatile_crash:
    applies_to: "volatile collateral (market-priced: BTC, ETH, LST…)"
    annual_rate: {value: 0.5, hypothesis: true, why: "A 15 to 40% drop within a few days: about once every two years on major cryptos.", range: [0.2, 1.0]}
    severity: {value: [0.15, 0.40], hypothesis: true, why: "Historical crypto crashes over a few days (order of magnitude)."}
    speed: gradual
  rwa_credit_event:
    applies_to: "collateral priced by an internal rate, a NAV or a fixed price (RWA, synthetic dollar, LST priced at the exchange rate, PT)"
    annual_rate: {value: 0.05, hypothesis: true, why: "Default / fraud / sudden mark-down of an RWA or synthetic-dollar asset: rare but not negligible (precedent: xUSD cascade, Nov. 2025).", range: [0.01, 0.15]}
    severity: {value: [0.05, 0.50], hypothesis: true, why: "From a moderate discount to a partial default."}
    speed: jump
    oracle_tracks: false
    oracle_tracks_why: "A rate published by the issuer (NAV, internal rate) or set by an admin LAGS reality in a crisis: no timely liquidation."
  oracle_fault:
    applies_to: "market price feed (Chainlink, RedStone market…)"
    annual_rate: {value: 0.01, hypothesis: true, why: "Outage / wrong price of a market feed: rare.", range: [0.002, 0.05]}
    severity: {value: [0.05, 0.50], hypothesis: true, why: "Gap of the reported price (up OR down, 50/50)."}
    speed: jump
  admin_feed_compromise:
    applies_to: "feed whose price is set by an administrator (e.g. Midas)"
    annual_rate: {value: 0.02, hypothesis: true, why: "Compromised admin key or input error: more frequent than a Chainlink outage, bounded by on-chain min/max.", range: [0.005, 0.05]}
    severity: {value: "on-chain bounds", hypothesis: true, why: "The admin cannot leave [minAnswer, maxAnswer] (read on-chain): the severity is the gap up to those bounds."}
    speed: jump
  internal_rate_fault:
    applies_to: "internal-rate / NAV feed (adapters, RedStone fundamental, Chainlink exchange rate)"
    annual_rate: {value: 0.01, hypothesis: true, why: "Computation error / manipulation of a token's internal rate: rare.", range: [0.002, 0.05]}
    severity: {value: [0.05, 0.30], hypothesis: true, why: "Gap of the reported rate (up or down)."}
    speed: jump
  issuer_failure:
    applies_to: "issuer of an asset in the graph"
    annual_rate: {value: 0.005, hypothesis: true, why: "Operational failure of an established issuer: rare.", range: [0.001, 0.02]}
    severity: {value: [0.10, 1.0], hypothesis: true, why: "Value loss of the issued assets."}
    speed: jump
  protocol_exploit:
    applies_to: "lending protocol (Morpho Blue) — hits all deposited funds"
    annual_rate: {value: 0.003, hypothesis: true, why: "Morpho Blue is immutable and audited: an exploit is deemed rare.", range: [0.001, 0.01]}
    severity: {value: [0.05, 0.50], hypothesis: true, why: "Share of the funds lost in an exploit."}
    speed: jump
  curator_failure:
    applies_to: "curator of a V2 vault"
    annual_rate: {value: 0.005, hypothesis: true, why: "Bad allocation / compromised key, limited by the vault's caps and timelocks.", range: [0.001, 0.02]}
    severity: {value: [0.0, 0.20], hypothesis: true, why: "Per-market caps bound the possible loss."}
    speed: jump

incident_p_default:
  value: 0.5
  hypothesis: true
  why: "Incident mode: without the manager's view, we assume a 1-in-2 chance that the reported incident materialises; the decision mostly shows p*."
  range: [0.1, 0.9]
