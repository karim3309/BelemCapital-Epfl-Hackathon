# =====================================================================
#  StackTrace — PARAMÈTRES DU MOTEUR DE RISQUE
# =====================================================================
# Chaque paramètre a OBLIGATOIREMENT un statut (le chargeur src/risk/params.py refuse sinon) :
#
#   source: https://...   + as_of: AAAA-MM-JJ   → chiffre/formule lu dans une doc officielle
#   source: onchain       + field: <chemin>     → valeur lue dans output/graph.json ou output/risk_inputs.json
#   hypothesis: true      + why: "<1 phrase>"   → choix de modélisation de NOTRE équipe, assumé et affiché
#
# Règle d'or : on n'invente aucun chiffre. Quand on ne sait pas, on le DIT (hypothesis) et on
# montre la sensibilité du résultat à ce choix (champ `range` = valeurs testées en sensibilité).
# =====================================================================
version: 1

# ---------------------------------------------------------------------------------------------
# Décision
# ---------------------------------------------------------------------------------------------
horizon_days:
  value: 7
  hypothesis: true
  why: "Horizon de décision d'une astreinte risque ; le cadrage le liste comme question ouverte aux mentors (24 h ou 7 jours)."
  range: [1, 30]

# ---------------------------------------------------------------------------------------------
# Morpho Blue : liquidation (formule officielle)
# ---------------------------------------------------------------------------------------------
morpho_lif_beta:
  value: 0.3
  source: "https://docs.morpho.org/learn/concepts/liquidation/"
  as_of: "2026-10-10"
  note: "LIF = min(M, 1 / (β·LLTV + (1−β))) avec β = 0,3"
morpho_lif_max:
  value: 1.15
  source: "https://docs.morpho.org/learn/concepts/liquidation/"
  as_of: "2026-10-10"
  note: "M = 1,15 (bonus maximal de 15 %)"
liquidation_repaid_fraction:
  value: 1.0
  hypothesis: true
  why: "La doc Morpho autorise un liquidateur à rembourser jusqu'à 100 % de la dette en une fois ; on prend ce pire cas pour l'emprunteur."
  range: [0.5, 1.0]
liquidator_requires_profit:
  value: true
  hypothesis: true
  why: "Un liquidateur n'agit que si le bonus couvre le coût de revente du collatéral saisi (sinon : pas de liquidation, dette à risque chez les prêteurs)."

# ---------------------------------------------------------------------------------------------
# Méta-oracle (Steakhouse MetaOracleDeviationTimelock) : paramètres LUS ON-CHAIN
# ---------------------------------------------------------------------------------------------
meta_oracle_deviation_formula:
  value: "abs(primary - backup) / average(primary, backup)"
  source: "https://steakhouse.financial/docs/products/infrastructure/metaoracle"
  as_of: "2026-10-10"
meta_oracle_deviation_threshold:
  source: onchain
  field: "graph:oracle[oracle_kind=morpho_meta_oracle_deviation_timelock].meta.deviation_threshold"
meta_oracle_challenge_timelock_seconds:
  source: onchain
  field: "graph:oracle[oracle_kind=morpho_meta_oracle_deviation_timelock].meta.challenge_timelock_seconds"
meta_oracle_healing_timelock_seconds:
  source: onchain
  field: "graph:oracle[oracle_kind=morpho_meta_oracle_deviation_timelock].meta.healing_timelock_seconds"
challenger_delay_hours:
  value: 0
  hypothesis: true
  why: "challenge() est sans permission (doc Steakhouse) : on suppose qu'un bot l'appelle dès que l'écart dépasse le seuil (pire cas pour l'emprunteur)."
  range: [0, 12]

# ---------------------------------------------------------------------------------------------
# Coût de sortie C_exit
# ---------------------------------------------------------------------------------------------
exit_pendle_leg:
  source: onchain
  field: "inputs:exit_simulations"
  note: "Vente PT → SY simulée au bloc figé par RouterStatic.swapExactPtForSyStatic (Pendle), plusieurs tailles."
stressed_pool_scaling:
  value: "vendre Q dans un pool k fois plus petit ≈ vendre Q/k dans le pool actuel"
  hypothesis: true
  why: "Approximation au 1er ordre valable pour un AMM ; on ne peut pas simuler on-chain un pool qui n'existe pas encore."
second_leg_cost_rate:
  value: 0.0005
  hypothesis: true
  why: "Conversion sUSDe/USDe → USDC pour rembourser la dette : pools non découverts, frais d'un pool stable de l'ordre de quelques points de base (non mesuré)."
  range: [0.0, 0.005]
unwind_gas_units:
  value: 1500000
  hypothesis: true
  why: "Débouclage = flash-loan + remboursement Morpho + retrait + swap Pendle + swap stable ; ordre de grandeur de quelques transactions DeFi, non mesuré."
  range: [500000, 3000000]
gas_base_fee:
  source: onchain
  field: "inputs:gas.base_fee_gwei"
gas_token_usd:
  source: onchain
  field: "inputs:gas.eth_usd"
carry_pt_implied_apy:
  source: onchain
  field: "graph:liquidity_venue.meta.implied_apy"
  note: "Rendement fixe du PT abandonné si l'on sort (sur l'horizon)."
carry_borrow_apy:
  source: onchain
  field: "graph:lending_market.meta.borrow_apy"
  note: "Coût d'emprunt économisé si l'on sort (sur l'horizon)."

# ---------------------------------------------------------------------------------------------
# Transmission des chocs (propagation)
# ---------------------------------------------------------------------------------------------
pt_extra_amm_discount_under_stress:
  value: 0.0
  hypothesis: true
  why: "Le cadrage prévoit « PT ≈ −d % plus la décote de l'AMM » ; on ne sait pas calibrer cette décote supplémentaire, valeur de base 0 et sensibilité affichée."
  range: [0.0, 0.03]
custodian_backing_share:
  value: 0.3333
  hypothesis: true
  why: "Ethena cite 3 fournisseurs OES (Copper, Ceffu, Fireblocks) sans répartition dans notre couche curée : répartition égale supposée."
  range: [0.1, 0.6]
exchange_exposure_share:
  value: 0.02
  hypothesis: true
  why: "D'après Ethena, l'exposition à un exchange est limitée au PnL non réglé entre deux cycles de règlement (doc 'Exchange Failure Risk') : petite fraction des réserves."
  range: [0.005, 0.1]
  source_context: "https://docs.ethena.fi/solution-overview/risks/exchange-failure-risk"

# ---------------------------------------------------------------------------------------------
# Calibration de la sévérité d'un depeg USDe (historique on-chain)
# ---------------------------------------------------------------------------------------------
usde_depeg_worst_observed:
  source: onchain
  field: "inputs:calibration.usde_worst_drawdown"
  note: "Tous les rounds du feed Chainlink USDe/USD (phases 1 et 2) lus au bloc figé : pire écart observé, temps passé sous chaque seuil."

# ---------------------------------------------------------------------------------------------
# Événements racines du Monte Carlo : probabilité annuelle λ, sévérité, durée
#   target = sélecteur de nœuds du graph.json (id, ou type + role/oracle_kind/asset_kind)
#   Sauf mention contraire, λ est une HYPOTHÈSE d'ordre de grandeur (le dataset de hacks DeFiLlama
#   est payant : on ne l'a pas). La décision repose sur p* qui, lui, ne dépend pas de λ.
# ---------------------------------------------------------------------------------------------
events:
  usde_market_depeg:
    target: {id: usde}
    kind: market_depeg
    annual_rate: {source: onchain, field: "inputs:calibration.usde_depeg_annual_rate_099", method: "épisodes du feed Chainlink USDe/USD sous 0,99 $ par année observée (src/risk/calibrate.py) ; si 0 épisode : règle de 3"}
    severity: {hypothesis: true, value: [0.005, 0.025], why: "Calée sur l'historique on-chain : pire écart Chainlink observé ≈ 2,3 % (21/02/2025)."}
    duration_hours: {hypothesis: true, value: [0.05, 1.0], why: "Calée sur l'historique on-chain : le plus long passage sous 0,99 $ a duré ~7 min."}
  usde_severe_depeg:
    target: {id: usde}
    kind: market_depeg
    annual_rate: {hypothesis: true, value: 0.1, why: "Jamais observé on-chain en ~2,5 ans (la règle de 3 donne une borne haute de ~1,2/an) : on retient une crise majeure de dollar synthétique tous les ~10 ans."}
    severity: {hypothesis: true, value: [0.05, 0.30], why: "Au-delà de l'historique : de −5 % (seuil de liquidation de la position) à −30 % (scénario de démo du cadrage)."}
    duration_hours: {hypothesis: true, value: [6, 168], why: "Une crise de confiance dure de quelques heures à plus d'une semaine."}
  exchange_failure:
    target: {type: offchain_counterparty, role: hedging_venue}
    kind: counterparty_failure
    annual_rate: {hypothesis: true, value: 0.01, why: "Ordre de grandeur : une faillite d'exchange majeur (FTX, 2022) en quelques années parmi les grands venues."}
    severity: {hypothesis: true, value: [0.5, 1.0], why: "Part des fonds perdus chez l'exchange défaillant (exposition d'Ethena limitée au PnL non réglé, voir exchange_exposure_share)."}
    panic_depeg: {hypothesis: true, value: [0.0, 0.05], why: "Décote de panique de l'USDe le temps que le marché comprenne l'exposition réelle."}
    duration_hours: {hypothesis: true, value: [24, 168], why: "Une faillite d'exchange se règle en jours, pas en heures."}
  custodian_failure:
    target: {type: offchain_counterparty, role: custodian_off_exchange_settlement}
    kind: counterparty_failure
    annual_rate: {hypothesis: true, value: 0.003, why: "Les custodians OES sont des entités régulées et ségrégées : défaillance jugée plus rare qu'un exchange."}
    severity: {hypothesis: true, value: [0.1, 1.0], why: "Part des actifs bloqués/perdus chez le custodian défaillant."}
    duration_hours: {hypothesis: true, value: [168, 168], why: "Choc durable (au moins l'horizon)."}
  ethena_failure:
    target: {id: ethena_labs}
    kind: issuer_failure
    annual_rate: {hypothesis: true, value: 0.005, why: "Défaillance opérationnelle / contrat de l'émetteur, ordre de grandeur."}
    severity: {hypothesis: true, value: [0.1, 0.5], why: "Perte de valeur de l'USDe si l'émetteur défaille."}
    duration_hours: {hypothesis: true, value: [168, 168], why: "Choc durable."}
  pendle_exploit:
    target: {id: pendle}
    kind: issuer_failure
    annual_rate: {hypothesis: true, value: 0.01, why: "Exploit de contrats DeFi majeurs : ordre de grandeur annuel faible mais non nul."}
    severity: {hypothesis: true, value: [0.2, 1.0], why: "Perte de valeur des PT/SY touchés."}
    duration_hours: {hypothesis: true, value: [168, 168], why: "Choc durable."}
  morpho_exploit:
    target: {id: morpho}
    kind: protocol_exploit
    annual_rate: {hypothesis: true, value: 0.003, why: "Morpho Blue est un contrat immuable et audité : probabilité jugée plus faible."}
    severity: {hypothesis: true, value: [0.2, 1.0], why: "Part du collatéral perdue dans l'exploit."}
    duration_hours: {hypothesis: true, value: [168, 168], why: "Choc durable."}
  chainlink_feed_fault:
    target: {type: oracle, oracle_kind: chainlink_aggregator_proxy}
    kind: feed_fault
    annual_rate: {hypothesis: true, value: 0.01, why: "Panne / mauvais prix d'un feed : rare, ordre de grandeur."}
    severity: {hypothesis: true, value: [0.05, 0.5], why: "Écart du prix rapporté par rapport au vrai prix (vers le bas)."}
    duration_hours: {hypothesis: true, value: [1, 48], why: "Panne corrigée en heures à jours."}
  pool_liquidity_drain:
    target: {type: liquidity_venue}
    kind: liquidity_drain
    annual_rate: {hypothesis: true, value: 0.05, why: "Retraits massifs de LP en période de stress : plus fréquent qu'un exploit."}
    severity: {hypothesis: true, value: [0.5, 0.95], why: "Part de la liquidité du pool qui disparaît."}
    duration_hours: {hypothesis: true, value: [24, 168], why: "Quelques jours."}
  usdc_depeg:
    target: {id: usdc}
    kind: market_depeg
    annual_rate: {hypothesis: true, value: 0.01, why: "Depeg de l'USDC (précédent : mars 2023) : rare."}
    severity: {hypothesis: true, value: [0.02, 0.12], why: "Ampleur d'un depeg de l'USDC."}
    duration_hours: {hypothesis: true, value: [24, 72], why: "Quelques jours."}

monte_carlo:
  samples:
    value: 200000
    hypothesis: true
    why: "Assez de tirages pour stabiliser la perte attendue au dollar près ; graine fixe → résultat reproductible."
  seed:
    value: 20261010
    hypothesis: true
    why: "Graine fixe pour que deux exécutions donnent exactement le même rapport."
