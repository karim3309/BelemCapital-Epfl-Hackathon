# =====================================================================
#  StackTrace — RISK ENGINE PARAMETERS
# =====================================================================
# Every parameter MUST have a status (the loader src/risk/params.py refuses otherwise):
#
#   source: https://...   + as_of: YYYY-MM-DD   → number/formula read in official docs
#   source: onchain       + field: <path>       → value read in output/graph.json or output/risk_inputs.json
#   hypothesis: true      + why: "<1 sentence>" → modelling choice of OUR team, stated and displayed
#
# Golden rule: we invent no number. When we do not know, we SAY so (hypothesis) and we
# show how sensitive the result is to that choice (`range` field = values tested in sensitivity).
# =====================================================================
version: 1

# ---------------------------------------------------------------------------------------------
# Decision
# ---------------------------------------------------------------------------------------------
horizon_days:
  value: 7
  hypothesis: true
  why: "Decision horizon of a risk on-call shift; the framing note lists it as an open question for the mentors (24 h or 7 days)."
  range: [1, 30]

# ---------------------------------------------------------------------------------------------
# Morpho Blue: liquidation (official formula)
# ---------------------------------------------------------------------------------------------
morpho_lif_beta:
  value: 0.3
  source: "https://docs.morpho.org/learn/concepts/liquidation/"
  as_of: "2026-10-10"
  note: "LIF = min(M, 1 / (β·LLTV + (1−β))) with β = 0.3"
morpho_lif_max:
  value: 1.15
  source: "https://docs.morpho.org/learn/concepts/liquidation/"
  as_of: "2026-10-10"
  note: "M = 1.15 (maximum bonus of 15%)"
liquidation_repaid_fraction:
  value: 1.0
  hypothesis: true
  why: "The Morpho docs let a liquidator repay up to 100% of the debt at once; we take that worst case for the borrower."
  range: [0.5, 1.0]
liquidator_requires_profit:
  value: true
  hypothesis: true
  why: "A liquidator only acts if the bonus covers the cost of reselling the seized collateral (otherwise: no liquidation, debt at risk for the lenders)."

# ---------------------------------------------------------------------------------------------
# Meta-oracle (Steakhouse MetaOracleDeviationTimelock): parameters READ ON-CHAIN
# ---------------------------------------------------------------------------------------------
meta_oracle_deviation_formula:
  value: "abs(primary - backup) / average(primary, backup)"
  source: "https://steakhouse.financial/docs/products/infrastructure/metaoracle"
  as_of: "2026-10-10"
meta_oracle_deviation_threshold:
  source: onchain
  field: "graph:oracle[oracle_kind=morpho_meta_oracle_deviation_timelock].meta.deviation_threshold"
meta_oracle_challenge_timelock_seconds:
  source: onchain
  field: "graph:oracle[oracle_kind=morpho_meta_oracle_deviation_timelock].meta.challenge_timelock_seconds"
meta_oracle_healing_timelock_seconds:
  source: onchain
  field: "graph:oracle[oracle_kind=morpho_meta_oracle_deviation_timelock].meta.healing_timelock_seconds"
challenger_delay_hours:
  value: 0
  hypothesis: true
  why: "challenge() is permissionless (Steakhouse docs): we assume a bot calls it as soon as the deviation exceeds the threshold (worst case for the borrower)."
  range: [0, 12]

# ---------------------------------------------------------------------------------------------
# Exit cost C_exit
# ---------------------------------------------------------------------------------------------
exit_pendle_leg:
  source: onchain
  field: "inputs:exit_simulations"
  note: "PT → SY sale simulated at the pinned block by RouterStatic.swapExactPtForSyStatic (Pendle), at several sizes."
stressed_pool_scaling:
  value: "selling Q in a pool k times smaller ≈ selling Q/k in the current pool"
  hypothesis: true
  why: "First-order approximation valid for an AMM; a pool that does not exist yet cannot be simulated on-chain."
second_leg_cost_rate:
  value: 0.0005
  hypothesis: true
  why: "sUSDe/USDe → USDC conversion to repay the debt: pools not discovered, fees of a stable pool in the order of a few basis points (not measured)."
  range: [0.0, 0.005]
unwind_gas_units:
  value: 1500000
  hypothesis: true
  why: "Unwind = flash loan + Morpho repayment + withdrawal + Pendle swap + stable swap; order of magnitude of a few DeFi transactions, not measured."
  range: [500000, 3000000]
gas_base_fee:
  source: onchain
  field: "inputs:gas.base_fee_gwei"
gas_token_usd:
  source: onchain
  field: "inputs:gas.eth_usd"
carry_pt_implied_apy:
  source: onchain
  field: "graph:liquidity_venue.meta.implied_apy"
  note: "Fixed yield of the PT forgone when exiting (over the horizon)."
carry_borrow_apy:
  source: onchain
  field: "graph:lending_market.meta.borrow_apy"
  note: "Borrowing cost saved when exiting (over the horizon)."

# ---------------------------------------------------------------------------------------------
# Shock transmission (propagation)
# ---------------------------------------------------------------------------------------------
pt_extra_amm_discount_under_stress:
  value: 0.0
  hypothesis: true
  why: "The framing note expects \"PT ≈ −d% plus the AMM discount\"; we cannot calibrate that extra discount, base value 0 and sensitivity displayed."
  range: [0.0, 0.03]
custodian_backing_share:
  value: 0.3333
  hypothesis: true
  why: "Ethena cites 3 OES providers (Copper, Ceffu, Fireblocks) with no split in our curated layer: an equal split is assumed."
  range: [0.1, 0.6]
exchange_exposure_share:
  value: 0.02
  hypothesis: true
  why: "According to Ethena, the exposure to an exchange is limited to the unsettled PnL between two settlement cycles ('Exchange Failure Risk' docs): a small fraction of the reserves."
  range: [0.005, 0.1]
  source_context: "https://docs.ethena.fi/solution-overview/risks/exchange-failure-risk"

# ---------------------------------------------------------------------------------------------
# Calibration of the severity of a USDe depeg (on-chain history)
# ---------------------------------------------------------------------------------------------
usde_depeg_worst_observed:
  source: onchain
  field: "inputs:calibration.usde_worst_drawdown"
  note: "Every round of the Chainlink USDe/USD feed (phases 1 and 2) read at the pinned block: worst deviation observed, time spent below each threshold."

# ---------------------------------------------------------------------------------------------
# Monte Carlo root events: annual probability λ, severity, duration
#   target = node selector of graph.json (id, or type + role/oracle_kind/asset_kind)
#   Unless stated otherwise, λ is an order-of-magnitude HYPOTHESIS (the DeFiLlama hacks dataset
#   is paid: we do not have it). The decision relies on p*, which does not depend on λ.
# ---------------------------------------------------------------------------------------------
events:
  usde_market_depeg:
    target: {id: usde}
    kind: market_depeg
    annual_rate: {source: onchain, field: "inputs:calibration.usde_depeg_annual_rate_099", method: "episodes of the Chainlink USDe/USD feed below $0.99 per year observed (src/risk/calibrate.py); if 0 episodes: rule of 3"}
    severity: {hypothesis: true, value: [0.005, 0.025], why: "Set from the on-chain history: worst Chainlink deviation observed ≈ 2.3% (21/02/2025)."}
    duration_hours: {hypothesis: true, value: [0.05, 1.0], why: "Set from the on-chain history: the longest stretch below $0.99 lasted ~7 min."}
  usde_severe_depeg:
    target: {id: usde}
    kind: market_depeg
    annual_rate: {hypothesis: true, value: 0.1, why: "Never observed on-chain in ~2.5 years (the rule of 3 gives an upper bound of ~1.2/year): we take one major synthetic-dollar crisis every ~10 years."}
    severity: {hypothesis: true, value: [0.05, 0.30], why: "Beyond the history: from −5% (the position's liquidation threshold) to −30% (the framing note's demo scenario)."}
    duration_hours: {hypothesis: true, value: [6, 168], why: "A confidence crisis lasts from a few hours to more than a week."}
  exchange_failure:
    target: {type: offchain_counterparty, role: hedging_venue}
    kind: counterparty_failure
    annual_rate: {hypothesis: true, value: 0.01, why: "Order of magnitude: one major exchange failure (FTX, 2022) in a few years among the large venues."}
    severity: {hypothesis: true, value: [0.5, 1.0], why: "Share of the funds lost at the failed exchange (Ethena's exposure limited to unsettled PnL, see exchange_exposure_share)."}
    panic_depeg: {hypothesis: true, value: [0.0, 0.05], why: "Panic discount on USDe while the market works out the real exposure."}
    duration_hours: {hypothesis: true, value: [24, 168], why: "An exchange failure is settled in days, not hours."}
  custodian_failure:
    target: {type: offchain_counterparty, role: custodian_off_exchange_settlement}
    kind: counterparty_failure
    annual_rate: {hypothesis: true, value: 0.003, why: "OES custodians are regulated, segregated entities: failure deemed rarer than an exchange's."}
    severity: {hypothesis: true, value: [0.1, 1.0], why: "Share of the assets frozen/lost at the failed custodian."}
    duration_hours: {hypothesis: true, value: [168, 168], why: "Lasting shock (at least the horizon)."}
  ethena_failure:
    target: {id: ethena_labs}
    kind: issuer_failure
    annual_rate: {hypothesis: true, value: 0.005, why: "Operational / contract failure of the issuer, order of magnitude."}
    severity: {hypothesis: true, value: [0.1, 0.5], why: "USDe value loss if the issuer fails."}
    duration_hours: {hypothesis: true, value: [168, 168], why: "Lasting shock."}
  pendle_exploit:
    target: {id: pendle}
    kind: issuer_failure
    annual_rate: {hypothesis: true, value: 0.01, why: "Exploit of major DeFi contracts: low but non-zero annual order of magnitude."}
    severity: {hypothesis: true, value: [0.2, 1.0], why: "Value loss of the affected PT/SY."}
    duration_hours: {hypothesis: true, value: [168, 168], why: "Lasting shock."}
  morpho_exploit:
    target: {id: morpho}
    kind: protocol_exploit
    annual_rate: {hypothesis: true, value: 0.003, why: "Morpho Blue is an immutable, audited contract: probability deemed lower."}
    severity: {hypothesis: true, value: [0.2, 1.0], why: "Share of the collateral lost in the exploit."}
    duration_hours: {hypothesis: true, value: [168, 168], why: "Lasting shock."}
  chainlink_feed_fault:
    target: {type: oracle, oracle_kind: chainlink_aggregator_proxy}
    kind: feed_fault
    annual_rate: {hypothesis: true, value: 0.01, why: "Outage / wrong price of a feed: rare, order of magnitude."}
    severity: {hypothesis: true, value: [0.05, 0.5], why: "Gap between the reported price and the true price (downwards)."}
    duration_hours: {hypothesis: true, value: [1, 48], why: "Outage fixed within hours to days."}
  pool_liquidity_drain:
    target: {type: liquidity_venue}
    kind: liquidity_drain
    annual_rate: {hypothesis: true, value: 0.05, why: "Massive LP withdrawals during stress: more frequent than an exploit."}
    severity: {hypothesis: true, value: [0.5, 0.95], why: "Share of the pool's liquidity that disappears."}
    duration_hours: {hypothesis: true, value: [24, 168], why: "A few days."}
  usdc_depeg:
    target: {id: usdc}
    kind: market_depeg
    annual_rate: {hypothesis: true, value: 0.01, why: "USDC depeg (precedent: March 2023): rare."}
    severity: {hypothesis: true, value: [0.02, 0.12], why: "Size of a USDC depeg."}
    duration_hours: {hypothesis: true, value: [24, 72], why: "A few days."}

monte_carlo:
  samples:
    value: 200000
    hypothesis: true
    why: "Enough draws to stabilise the expected loss to the dollar; fixed seed → reproducible result."
  seed:
    value: 20261010
    hypothesis: true
    why: "Fixed seed so that two runs give exactly the same report."
