# =====================================================================
#  StackTrace — STRESS SCENARIOS (deterministic)
# =====================================================================
# A scenario = "what happens to the position IF such incident happens?"
# Sizes/durations are scenario CHOICES (status: hypothesis): every scenario has a `why`.
# `p_default` = illustrative probability that the incident materialises over the horizon: it is up to
# the manager to set it; the decision mostly shows the THRESHOLD p* (independent of that value).
#
# shocks[].node    : id of a node of output/graph.json
# shocks[].select  : selector {type, role/oracle_kind/...} → one shock per node found
# shocks[].kind    : market_depeg | counterparty_failure | issuer_failure | protocol_exploit |
#                    feed_fault | feed_frozen | liquidity_drain | chain_halt
# duration_hours   : null = lasting (beyond the horizon)
# =====================================================================
scenarios:
  - id: S-USDe-30
    family: S-USDe
    title: "Lasting USDe depeg −30%"
    story: "The framing note's demo alert: USDe loses 30% and does not come back."
    why: "Demo scenario planned by the framing note (\"30% depeg\"), order of magnitude of a stablecoin failure."
    p_default: {value: 0.10, hypothesis: true, why: "Illustrative value; the manager sets their own probability."}
    shocks:
      - {node: usde, kind: market_depeg, severity: 0.30, duration_hours: null}

  - id: S-USDe-7-24h
    family: S-USDe
    title: "USDe depeg to $0.93 for 24 h"
    story: "A severe but temporary depeg: long enough to make the meta-oracle switch (16 h)."
    why: "Tests the 16 h rule: beyond the challenge delay, but a moderate-size shock."
    p_default: {value: 0.10, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {node: usde, kind: market_depeg, severity: 0.07, duration_hours: 24}

  - id: S-USDe-7-6h
    family: S-USDe
    title: "USDe depeg to $0.93 for 6 h"
    story: "Same size, but the shock stops BEFORE the end of the 16 h delay."
    why: "Shows that duration matters as much as size."
    p_default: {value: 0.10, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {node: usde, kind: market_depeg, severity: 0.07, duration_hours: 6}

  - id: S-EXCH-BINANCE
    family: S-EXCH
    title: "Binance failure (Ethena's hedges)"
    story: "An exchange where Ethena places its shorts goes bankrupt; temporary panic on USDe."
    why: "Brief and framing note: Ethena's off-chain dependency on perp exchanges. A 3% panic for 72 h chosen by us."
    p_default: {value: 0.05, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {node: binance, kind: counterparty_failure, severity: 1.0, panic: 0.03, duration_hours: 72}

  - id: S-EXCH-MULTI
    family: S-EXCH
    title: "Failure of 3 exchanges (Binance, Bybit, OKX)"
    story: "Systemic crisis of centralised exchanges: the panic on USDe lasts."
    why: "Extreme stress of the off-chain layer; a lasting 10% panic chosen by us."
    p_default: {value: 0.02, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {node: binance, kind: counterparty_failure, severity: 1.0, panic: 0.10, duration_hours: null}
      - {node: bybit, kind: counterparty_failure, severity: 1.0, duration_hours: null}
      - {node: okx, kind: counterparty_failure, severity: 1.0, duration_hours: null}

  - id: S-CUST-COPPER
    family: S-CUST
    title: "Custodian failure (Copper)"
    story: "Ethena's reserve assets held at Copper are frozen/lost."
    why: "Off-chain custody dependency; share of the reserves at this custodian = custodian_backing_share parameter."
    p_default: {value: 0.02, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {node: copper, kind: counterparty_failure, severity: 1.0, duration_hours: null}

  - id: S-ORACLE-WRONG
    family: S-ORACLE
    title: "Wrong Chainlink USDe/USD feed (−10%) for 24 h"
    story: "The market is healthy, but the fallback oracle's feed reports a price 10% too low."
    why: "Oracle outage / manipulation (framing note §4.3); tests what the meta-oracle does with a bad fallback."
    p_default: {value: 0.02, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {node: feed_usde_usd, kind: feed_fault, severity: 0.10, duration_hours: 24}

  - id: S-ORACLE-FROZEN
    family: S-ORACLE
    title: "Lasting USDe depeg −10% with a frozen Chainlink feed"
    story: "USDe loses 10%, but the fallback feed is stuck: no appraiser sees the crisis."
    why: "The framing note's \"oracle not following the market\" case: no liquidation, residual debt for the lenders."
    p_default: {value: 0.02, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {node: usde, kind: market_depeg, severity: 0.10, duration_hours: null}
      - {node: feed_usde_usd, kind: feed_frozen, duration_hours: null}

  - id: S-POOL-HALF
    family: S-POOL
    title: "Pendle pool halved"
    story: "Half of the LPs pull their liquidity: the value does not move, but exiting costs more."
    why: "Liquidity freeze / flight (framing note §4.3)."
    p_default: {value: 0.10, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {select: {type: liquidity_venue}, kind: liquidity_drain, severity: 0.5, duration_hours: 168}

  - id: S-POOL-TENTH
    family: S-POOL
    title: "Pendle pool divided by 10"
    story: "Massive liquidity flight: a full exit becomes impossible on the pool."
    why: "Extreme liquidity freeze (\"how long before exit liquidity disappears\", Léa persona)."
    p_default: {value: 0.05, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {select: {type: liquidity_venue}, kind: liquidity_drain, severity: 0.9, duration_hours: 168}

  - id: S-USDC-5
    family: S-USDC
    title: "USDC depeg to $0.95 for 72 h"
    story: "The BORROWED asset loses its peg: the debt is worth less in dollars."
    why: "Dependency on Circle; historical precedent of a USDC depeg. Size chosen by us."
    p_default: {value: 0.02, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {node: usdc, kind: market_depeg, severity: 0.05, duration_hours: 72}

  - id: S-PENDLE-EXPLOIT
    family: S-PROTOCOL
    title: "Pendle exploit: the SY loses 50%"
    story: "A flaw in the Pendle contracts devalues the SY, hence the PT."
    why: "Contract risk (framing note §4.3: exploit). Size chosen by us."
    p_default: {value: 0.01, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {node: pendle, kind: issuer_failure, severity: 0.5, duration_hours: null}

  - id: S-MORPHO-EXPLOIT
    family: S-PROTOCOL
    title: "Morpho exploit: collateral stolen"
    story: "A flaw in Morpho Blue drains the market's collateral."
    why: "Contract risk of the lending market. Maximum size chosen by us."
    p_default: {value: 0.005, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {node: morpho, kind: protocol_exploit, severity: 1.0, duration_hours: null}

  - id: S-CHAIN-HALT
    family: S-CHAIN
    title: "Ethereum halted during a 24 h USDe depeg of −10%"
    story: "The chain stops: nobody can challenge the oracle, liquidate or exit."
    why: "Chain halt (framing note §4.3). Combined with a depeg to show the effect."
    p_default: {value: 0.005, hypothesis: true, why: "Illustrative value."}
    shocks:
      - {node: usde, kind: market_depeg, severity: 0.10, duration_hours: 24}
      - {select: {type: chain}, kind: chain_halt, duration_hours: 24}

  - id: S-TIME
    family: S-TIME
    title: "Nothing happens until the PT matures"
    story: "Time passes: the PT converges to 1, the debt grows at the borrow rate."
    why: "No-incident reference (prompt S-TIME)."
    p_default: {value: 1.0, hypothesis: true, why: "Time passes for sure."}
    time_offset: to_maturity
    shocks: []

# Front slider grid: USDe price × duration (hours). null = lasting.
usde_grid:
  why: "Grid from the prompt ($0.99 → $0.85; 1 h → 72 h), refined for a smooth slider."
  prices: [1.0, 0.995, 0.9925, 0.99, 0.985, 0.98, 0.97, 0.96, 0.955, 0.95, 0.94, 0.93, 0.92, 0.90, 0.875, 0.85, 0.80, 0.75, 0.70]
  durations_hours: [1, 3, 6, 12, 15, 16, 18, 24, 48, 72, 168, null]
  p_default: {value: 0.10, hypothesis: true, why: "Illustrative value for the slider's default verdict."}
