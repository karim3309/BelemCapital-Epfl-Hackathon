[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stacktrace"
version = "0.2.0"
description = "StackTrace — proven dependency graph, impact and stay/exit decision for a DeFi position (Belem DeFi Risk hackathon)"
requires-python = ">=3.11"
dependencies = [
    "web3>=7.6,<8", "requests>=2.31", "networkx>=3.2", "numpy>=1.26", "pyyaml>=6.0", "python-dotenv>=1.0",
    "fastapi>=0.115", "uvicorn>=0.30",   # backend v2 HTTP API
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
