# =====================================================================
#  Couche CURÉE : ce qui N'EST PAS lisible on-chain, mais qui est VÉRIFIABLE.
# =====================================================================
# Règles (appliquées par src/discovery/adapters/curated.py, qui refuse de charger sinon) :
#   1. chaque entrée a une `evidence_url` publique (doc officielle, page de transparence) ;
#   2. chaque entrée a une date `as_of` : une info curée VIEILLIT (Ethena rééquilibre ses hedges) ;
#   3. on recopie ce que dit la source, sans extrapoler. Si la source dit « par exemple », on l'écrit.
#   4. les `type` utilisent le vocabulaire figé (src/discovery/vocab.py).
# Toutes les entrées ci-dessous ont été relevées le 2026-10-10 par Claude dans la doc officielle :
#   → l'équipe doit les re-vérifier (docs/VERIFY.md, section « curated »).
# =====================================================================
version: 1
last_reviewed: "2026-10-10"

# ---------------------------------------------------------------------
# Entités hors chaîne (émetteurs, custodians, exchanges)
# ---------------------------------------------------------------------
entities:
  - key: ethena_labs
    type: issuer
    label: Ethena Labs
    evidence_url: "https://docs.ethena.fi/solution-design/key-addresses"
    as_of: "2026-10-10"
    note: "Émetteur de USDe et sUSDe (adresses listées dans « Key Addresses »)."

  - key: circle
    type: issuer
    label: Circle
    evidence_url: "https://developers.circle.com/stablecoins/usdc-contract-addresses"
    as_of: "2026-10-10"
    note: "Émetteur de USDC (adresse Ethereum listée par Circle)."

  - key: pendle
    type: issuer
    label: Pendle Finance
    evidence_url: "https://github.com/pendle-finance/pendle-core-v2-public/blob/main/deployments/1-core.json"
    as_of: "2026-10-10"
    note: "Protocole émetteur des PT/YT/SY et des pools PT/SY (factories listées dans les déploiements officiels)."

  - key: morpho
    type: issuer
    label: Morpho
    evidence_url: "https://docs.morpho.org/developers/contracts/addresses/"
    as_of: "2026-10-10"
    note: "Protocole Morpho Blue (contrat singleton listé dans la doc officielle)."

  - key: chainlink
    type: issuer
    label: Chainlink
    evidence_url: "https://docs.chain.link/data-feeds/ens"
    as_of: "2026-10-10"
    note: "Les feeds officiels Chainlink sont enregistrés sous le domaine ENS data.eth."

  # --- Custodians « Off-Exchange Settlement » d'Ethena -----------------
  - key: copper
    type: offchain_counterparty
    label: "Copper (ClearLoop)"
    role: custodian_off_exchange_settlement
    evidence_url: "https://docs.ethena.fi/backing-custody-and-security/overview/off-exchange-settlement-in-detail"
    as_of: "2026-10-10"
    note: "La doc dit « Ethena uses multiple Off-Exchange Settlement providers such as Copper, Ceffu, and Fireblocks » : liste d'exemples, pas forcément exhaustive."
  - key: ceffu
    type: offchain_counterparty
    label: Ceffu
    role: custodian_off_exchange_settlement
    evidence_url: "https://docs.ethena.fi/backing-custody-and-security/overview/off-exchange-settlement-in-detail"
    as_of: "2026-10-10"
    note: "Cité comme fournisseur OES d'Ethena (« such as »)."
  - key: fireblocks
    type: offchain_counterparty
    label: Fireblocks
    role: custodian_off_exchange_settlement
    evidence_url: "https://docs.ethena.fi/backing-custody-and-security/overview/off-exchange-settlement-in-detail"
    as_of: "2026-10-10"
    note: "Cité comme fournisseur OES d'Ethena (« such as »)."

  # --- Exchanges où Ethena place ses hedges (shorts perpétuels) --------
  - key: binance
    type: offchain_counterparty
    label: Binance
    role: hedging_venue
    evidence_url: "https://docs.ethena.fi/solution-overview/risks/exchange-failure-risk"
    as_of: "2026-10-10"
    note: "Cité parmi les exchanges où Ethena trade ses dérivés (« such as Binance, Bybit, Bitget, Deribit, and Okx »). Répartition : voir les dashboards de transparence Ethena."
  - key: bybit
    type: offchain_counterparty
    label: Bybit
    role: hedging_venue
    evidence_url: "https://docs.ethena.fi/solution-overview/risks/exchange-failure-risk"
    as_of: "2026-10-10"
    note: "Cité parmi les exchanges de hedge d'Ethena (« such as »)."
  - key: bitget
    type: offchain_counterparty
    label: Bitget
    role: hedging_venue
    evidence_url: "https://docs.ethena.fi/solution-overview/risks/exchange-failure-risk"
    as_of: "2026-10-10"
    note: "Cité parmi les exchanges de hedge d'Ethena (« such as »)."
  - key: deribit
    type: offchain_counterparty
    label: Deribit
    role: hedging_venue
    evidence_url: "https://docs.ethena.fi/solution-overview/risks/exchange-failure-risk"
    as_of: "2026-10-10"
    note: "Cité parmi les exchanges de hedge d'Ethena (« such as »)."
  - key: okx
    type: offchain_counterparty
    label: OKX
    role: hedging_venue
    evidence_url: "https://docs.ethena.fi/solution-overview/risks/exchange-failure-risk"
    as_of: "2026-10-10"
    note: "Cité parmi les exchanges de hedge d'Ethena (« such as »)."

