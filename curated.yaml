# =====================================================================
#  CURATED layer: what CANNOT be read on-chain, but CAN be verified.
# =====================================================================
# Rules (enforced by src/discovery/adapters/curated.py, which refuses to load otherwise):
#   1. every entry has a public `evidence_url` (official docs, transparency page);
#   2. every entry has an `as_of` date: curated information AGES (Ethena rebalances its hedges);
#   3. we copy what the source says, without extrapolating. If the source says "for example", we write it.
#   4. `type` values use the frozen vocabulary (src/discovery/vocab.py).
# All entries below were collected on 2026-10-10 by Claude from the official docs:
#   → the team must re-check them (docs/VERIFY.md, "curated" section).
# =====================================================================
version: 1
last_reviewed: "2026-10-10"

