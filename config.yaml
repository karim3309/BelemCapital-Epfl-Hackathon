# =====================================================================
#  StackTrace — Discovery module configuration
# =====================================================================
# GOLDEN RULE: only the INPUTS of discovery live here.
# Everything else (PT, SY, sUSDe, USDe, oracles, feeds, Pendle pool...) is
# DISCOVERED on-chain from these inputs: it is never written by hand.
#
# Each address has a `source` (where it was read) and a `verified_by`.
# → Tick every line yourselves in docs/VERIFY.md (Etherscan + official docs).
# =====================================================================

chain:
  name: ethereum
  expected_chain_id: 1

# Pinned block: ALL calls are made at this block → reproducible and cacheable result.
# "latest" = resolved at launch (then copy the printed number here to pin it).
# An old block (> ~128 blocks) requires an "archive" RPC if it is not already in data/cache/.
snapshot_block: 26162087

rpc:
  url_env: ETH_RPC_URL          # name of the environment variable (.env file)

# ----- Position A -----------------------------------------------------
position:
  protocol: morpho
  # Morpho Blue market PT-sUSDE-26NOV2026 / USDC (the largest PT-sUSDe/USDC market found, on 2026-10-10)
  market_id: "0x5613b170ded221c588b6e9637b910f49e5508680ceede207f44aa72e5c46cb05"
  market_id_source: "Morpho API (markets search PT-sUSDE) + on-chain keccak256(MarketParams) recomputation"
  # A real borrower of the market (public address, picked from the top borrowers via the Morpho API).
  # Set null for a hypothetical position.
  user: "0x03BAbEB24619902253FDB0D5675A816879115d98"
  # null → value_usd computed on-chain (collateral × oracle price × Chainlink USDC/USD).
  # Set 1000000 to force the position size of the brief's example.
  value_usd_override: null

# ----- Infrastructure contracts (entry points) -------------------------
contracts:
  morpho_blue:
    address: "0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb"
    source: "https://docs.morpho.org/developers/contracts/addresses/"
    verified_by: "claude (official docs) — TO BE RE-CHECKED by the team on Etherscan"
  morpho_adaptive_curve_irm:
    address: "0x870aC11D48B15DB9a138Cf899d20F13F79Ba00BC"
    source: "https://docs.morpho.org/developers/contracts/addresses/"
    verified_by: "claude (official docs) — TO BE RE-CHECKED"
  morpho_chainlink_oracle_v2_factory:
    address: "0x3A7bB36Ee3f3eE32A60e9f2b33c1e5f2E83ad766"
    source: "https://docs.morpho.org/developers/contracts/addresses/"
    verified_by: "claude (official docs) — TO BE RE-CHECKED"
  pendle_router_static:
    # Used by the RISK ENGINE (src/risk/collect.py) to simulate a PT sale on-chain.
    # Function: swapExactPtForSyStatic(address,uint256) → official interface IPActionMarketCoreStatic
    # (npm package @pendle/core-v2@6.6.1, contracts/interfaces/IPActionMarketCoreStatic.sol)
    address: "0x263833d47eA3fA4a30f269323aba6a107f9eB14C"
    source: "https://github.com/pendle-finance/pendle-core-v2-public/blob/main/deployments/1-core.json"
    verified_by: "claude (official Pendle deployments, routerStatic key) — TO BE RE-CHECKED"
  ens_registry:
    address: "0x00000000000C2E074eC69A0dFb2997BA6C7d2e1e"
    source: "https://docs.ens.domains/learn/deployments"
    verified_by: "claude (official docs) — TO BE RE-CHECKED"

# ----- Curator books (backend v2: "book:<key>" analyses every vault of the list) -----
# A curator (RockawayX, Belem…) decides where a vault's money goes. Its "book" = the vaults it curates.
# Addresses = entry points, like the ones above: each one must be ticked off in docs/VERIFY.md.
curator_books:
  rockawayx:
    label: "RockawayX-curated Morpho vaults (Ethereum)"
    source: >-
      Vaults of the RockawayX Dune dashboard shared by Belem (https://dune.com/rockawayxvault/rockawayx-dashboard).
      Addresses located by the Morpho API (userByAddress of 0x4F87De7d21aeF48090958f7342E1F69Dff790545) and proven
      on-chain (name(), balanceOf) at block #26162868 — see docs/api_examples/pockets.json. The curator is re-read
      on-chain (curator()) at every analysis.
    verified_by: "claude (recorded API + on-chain reads) — RE-CHECK each address against the Dune dashboard / Etherscan"
    vaults:
      - {name: "Belem RWA EURCV", address: "0xD6d4b804014EF27836dBe9f8f6Bf6c71251548Ec"}
      - {name: "RockawayX f(x) Protocol Ecosystem USDC", address: "0x2cA22cb25558fa2018ecb1CE4eD8AF92Ee7ea423"}
      - {name: "RockawayX USDC Yield", address: "0xE0181090c22579B6A217f1522cbf8c9f1F0C1965"}
      - {name: "RockawayX Tori Ecosystem", address: "0x3BD9AdAE6643dDcddD02746b8B60075E56DF9478"}
      # Copied by the team from the Dune dashboard's vault list (2026-10-10), rows "ethereum · morpho":
      - {name: "RockawayX Confidential RWA USDC", address: "0xc207d3f66537D7F66456808379A0E560cF20Da36"}
      - {name: "Huma USDC Main", address: "0x8aC91877b93330f52b2979a31a4879506021475c"}
      - {name: "RockawayX NUVA Ecosystem", address: "0x93e0F9d502eEfce8D34924ab3478C7EA0CBC5a2E"}
      - {name: "RockawayX EUROP", address: "0x9C57E02bC31e7e463f439353D97bd8f42F5a7F9c"}
      - {name: "Midas USDC Prime (Ethereum)", address: "0xe99A27169c2aA26a8f2757949d09Fa3f9A8f0B3B"}
      - {name: "RockawayX wETH", address: "0x64C18DCC4Ccb3b8D27877a4aeBB4C3126CB39cB9"}
      - {name: "Figure USDC Main", address: "0xd65d6E8dbC3Cd3D12418199E6f4014dB3aaa0097"}
      - {name: "RockawayX PRIME USDC", address: "0x5f829B1B473cBA86838E1B7BB7E144DbDE228e21"}
    # = the 12 "ethereum · morpho" rows of the Dune list. Not here: "Midas USDC Prime (Base)" (Base chain).
    # Out of scope (no adapter yet): Solana/Kamino, Base, BSC, Sei, Pharos, Citrea vaults, and Ethereum vaults
    # on Upshift, Ember, Accountable and Midas. Only Morpho Vault V2 on Ethereum is analysed.

# Reference USD feed to convert the lent asset's price to USD (resolved on-chain via ENS).
usd_reference:
  loan_token_usd_feed_ens: "usdc-usd.data.eth"
  gas_token_usd_feed_ens: "eth-usd.data.eth"   # risk engine: gas cost in USD
  source: "https://docs.chain.link/data-feeds/ens"

# ----- APIs (only used when the information cannot be read on-chain) -----
apis:
  morpho_graphql:
    url: "https://api.morpho.org/graphql"
    source: "https://docs.morpho.org/developers/api/get-started/"
  pendle_core:
    url: "https://api-v2.pendle.finance/core"
    source: "https://docs.pendle.finance/pendle-v2-dev/Backend/ApiOverview"

discovery:
  max_nodes: 200         # anti-loop guard
  include_vaults: true   # vaults lending to the market (via the Morpho API)
  curated_file: curated.yaml
  output_file: output/graph.json
  cache_dir: data/cache
